<!doctype html>
<html>
  <head>
    <title>Bootstrap Buttons Exercise</title>
    <!--INCLUDING BOOTSTRAP-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body>
    <section class="container mt-5">
      <div class="row">
        <div class="col-6 col-md-4">
          <h1 class="text-light bg-dark text-center w-50">Bad News</h1>
        </div>
        <div role="alert" class="alert alert-warning col-6 col-md-4">
          You are going to die one day! It sucks, but it's normal :(
        </div>
        <div class="col bg-secondary">
          <button type="button" class="btn btn-success">
            Come To Terms With
          </button>
          <button type="button" class="btn btn-danger">Continue To Deny</button>
        </div>
      </div>
      <div class="row">
        <div class="col"></div>
        <div class="col-10 col-md-4 bg-danger">
          <h5>A Turma de Low Code vai Aprender JS! <i class="bi bi-envelope-open-heart"></i></h5>
        </div>
        <div class="col"></div>
      </div>

      <!-- ex pp 15 -->
      <div class="container mt-5">
        <div class="row">
          <div class="col-4 bg-danger">
            <h4>One Third</h4>
          </div>
          <div class="col-8 bg-info">
            <h4>Two Thirds</h4>
          </div>
        </div>
        <div class="row">
          <div class="col-6 col-md-3 bg-warning">
            <h4>One Quarter</h4>
          </div>

          <div class="col-6 col-md-6 bg-primary">
            <h4>One Half</h4>
          </div>

          <div class="col-12 col-md-3 bg-warning">
            <h4>One Quarter</h4>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
